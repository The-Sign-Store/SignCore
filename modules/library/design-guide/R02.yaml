# yaml-language-server: $schema=../../../schemas/rule.schema.json
schema: signcore.rule/v1
id: R02
version: 1.0.0
section: RIGID PANELS AND CNC (MultiCAM 5x10)
order: 530
basis: SignOS
applies_to:
  components:
    - SIGN_PANEL
    - ACM_PANEL
    - PVC_PANEL
    - CORO_SIGN
    - ACRYLIC_PANEL
    - BACKER_PANEL
standard: 'Square-cut panels go to the shear / saw: dimension the exact trim size. Rounded corners use the
  corner rounder radii only (1/4", 1/2", 1"); any other shape is a CNC route.'
why: SignOS times corner rounding separately from routing; standard radii keep it a quick shop step.
how_to: Rectangle tool > Property bar corner radius, or Window > Dockers > Corners (Fillet).
