# yaml-language-server: $schema=../../../schemas/component.schema.json
schema: signcore.component/v1
id: CLOUD_SIGN_FL
name: Cloud Sign - Front Lit
version: 1.0.0
order: 240
description: "Front lit cloud sign: quantity and size, with the front lit channel letter face, return, trim
  cap, LED and mounting options."
show_as_tool: false
repeatable: true
fields:
  - variable: QUANTITY
    label: QTY
    column: 1
    type: number
    default: "1"
    required: true
    notes: Number of cloud signs
  - variable: CLOUD SIZE
    column: 1
    type: dims
    options:
      - W
      - H
    required: true
    notes: Overall cloud sign size, inches
  - variable: FACE MATERIAL
    label: FACE
    column: 2
    type: select
    default: 3/16" Acrylic
    options:
      - 3/16" Acrylic
      - 3/16" Polycarbonate
    required: true
  - variable: FACE COLOR
    column: 2
    type: color
    default: White
    options:
      - Clear
      - White
      - Red
    required: true
  - variable: FACE VINYL
    label: VINYL
    column: 2
    type: select
    default: None
    options:
      - None
      - Translucent Vinyl
      - Translucent Digital Print
    required: true
    hide_values:
      - None
  - variable: VINYL COLOR
    column: 2
    type: vinyl
    default: "8500"
    options:
      - "8500"
      - "8800"
    show_if: FACE VINYL=Translucent Vinyl
    required: true
    signos: "Master_Mat_Vinyl_Cut: VIN_ROL_TRN_8500 / 8800"
  - variable: RETURN
    column: 3
    type: select
    default: 5" .040
    options:
      - 5" .040
      - 3" .040
    required: true
    signos: "Master_Mat_Fab_Channel: CLD-COM-COIL-5 / -3"
  - variable: RETURN COLOR
    column: 3
    type: db
    default: Gloss Black
    options:
      - COIL
    required: true
    signos: Coil_Colors
  - variable: TRIM CAP
    column: 3
    type: select
    default: 1"
    options:
      - 1"
      - 2"
    required: true
    signos: "Master_Mat_Fab_Channel: CLD-COM-TRIM-1"
  - variable: TRIM CAP COLOR
    column: 3
    type: db
    default: 1 Black"
    options:
      - TRIMCAP
    required: true
    signos: TrimCap_Colors
  - variable: LED COLOR
    column: 4
    type: db
    default: White (6500K)
    options:
      - LED
    required: true
    signos: "Master_Mat_Fab_Channel: CLD-SUP-LED-WHT"
  - variable: MOUNTING
    column: 4
    type: select
    default: Flush Mount
    options:
      - Flush Mount
      - Raceway
      - Panel
    required: true
  - variable: MOUNTING PAINT
    label: MOUNTING COLOR
    column: 4
    type: paint
    show_if: MOUNTING=Raceway|Panel
    required: true
  - variable: RACEWAY SIZE
    column: 4
    type: dims
    options:
      - L
      - H
      - D
    show_if: MOUNTING=Raceway
    required: true
    notes: Length x height x depth, inches
