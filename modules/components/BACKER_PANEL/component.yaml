# yaml-language-server: $schema=../../../schemas/component.schema.json
schema: signcore.component/v1
id: BACKER_PANEL
name: Backer Panel
version: 1.0.0
order: 120
description: Panel behind letters (flat, framed or routed shape).
show_as_tool: true
repeatable: false
fields:
  - variable: BACKER SIZE
    label: DIMENSIONS
    column: 1
    type: dims
    default: 120|36
    options:
      - W
      - H
    required: true
  - variable: BACKER TYPE
    label: TYPE
    column: 1
    type: select
    default: Flat
    options:
      - Flat
      - Framed
      - Custom Shape (Routed)
    required: true
  - variable: BACKER MATERIAL
    label: MATERIAL
    column: 2
    type: select
    default: 3mm ACM
    options:
      - 3mm ACM
      - 6mm ACM
      - .063 Aluminum over 2" Angle Frame
      - .080 Aluminum
    required: true
    signos: "INV_Sheets: SHT_ACM_*; Master_Mat_Metals"
  - variable: BACKER FINISH
    label: COLOR
    column: 2
    type: finish
    default: White
    options:
      - White
      - Black
      - Brushed Aluminum
    required: true
  - variable: BACKER MOUNTING
    label: MOUNTING
    column: 3
    type: select
    default: Stud Mount
    options:
      - Stud Mount
      - Lag to Wall
      - Z-Clips
    required: true
