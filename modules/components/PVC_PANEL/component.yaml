# yaml-language-server: $schema=../../../schemas/component.schema.json
schema: signcore.component/v1
id: PVC_PANEL
name: PVC Panel
version: 1.0.0
order: 150
description: PVC panel with print, vinyl or paint.
show_as_tool: false
repeatable: true
fields:
  - variable: QUANTITY
    label: QTY
    column: 1
    type: number
    default: "1"
    required: true
  - variable: SIZE
    label: DIMENSIONS
    column: 1
    type: dims
    default: 48|96
    options:
      - W
      - H
    required: true
  - variable: THICKNESS
    column: 1
    type: select
    default: 3mm
    options:
      - 3mm
      - 6mm
      - 1/2"
      - 1"
      - 1.5"
      - 2"
    required: true
  - variable: SIDEDNESS
    column: 2
    type: select
    default: Single Sided
    options:
      - Single Sided
      - Double Sided
    required: true
  - variable: MATERIAL COLOR
    column: 2
    type: color
    default: White
    options:
      - White
      - Black
    required: true
  - variable: GRAPHIC TYPE
    label: GRAPHIC
    column: 2
    type: select
    default: Direct Print
    options:
      - None
      - Direct Print
      - Digital Print Vinyl
      - Digital Print Contour Cut Vinyl
      - Contour Cut Vinyl
      - Paint
    required: true
  - variable: OVERLAMINATE
    column: 3
    type: select
    default: None
    options:
      - None
      - Arlon 3210 Premium Laminate
      - 3M 8518 Wrap Gloss Laminate
      - 3M 8519 Wrap Luster Laminate
      - 3M 8520 Wrap Matte Laminate
    show_if: GRAPHIC TYPE~=Print
    required: true
    signos: "Master_Mat_Vinyl_Print: VIN_ROL_LAM_*"
  - variable: PRINT COLOR
    label: COLOR
    column: 3
    type: fullcolor
    default: Full Color Digital
    show_if: GRAPHIC TYPE~=Print
  - variable: VINYL COLOR
    label: COLOR
    column: 3
    type: vinyl
    default: 751RA
    options:
      - "951"
      - 751RA
      - "651"
      - "631"
    show_if: GRAPHIC TYPE=Contour Cut Vinyl
    required: true
    signos: Master_Mat_Vinyl_Cut
  - variable: PAINT COLOR
    label: COLOR
    column: 3
    type: paint
    show_if: GRAPHIC TYPE=Paint
    required: true
    signos: SW_Colors / PMS_Colors
  - variable: ROUTING
    column: 3
    type: select
    default: No
    options:
      - No
      - Yes - Simple
      - Yes - Complex
    required: true
    signos: "Master_Services: SRV_CNC_SETUP_SMP / CPL"
  - variable: CORNERS
    column: 3
    type: select
    default: Square
    options:
      - Square
      - Rounded 1/4"
      - Rounded 1/2"
      - Rounded 1"
    hide_values:
      - Square
    notes: Rounded corners print a detail drawing
  - variable: MOUNTING
    column: 3
    type: select
    default: None
    options:
      - None
      - Tape
      - Stud Mount - Flush
      - Stud Mount - Spacer
      - Stand-offs
    hide_values:
      - None
  - variable: MOUNTING DETAIL
    label: MOUNT DETAIL
    column: 3
    type: text
    show_if: MOUNTING~=Spacer
    required: true
    notes: e.g. 1/2" spacer
  - variable: STANDOFF MODEL
    label: STANDOFF
    column: 3
    type: select
    default: AL25-30A
    options:
      - AL25-30A
      - AL16-25A
    show_if: MOUNTING=Stand-offs
    required: true
    notes: Aluminum standoff. Use Custom Input for other models / materials
  - variable: STANDOFF SIZE
    column: 3
    type: text
    default: 25 mm dia. x 30 mm
    show_if: MOUNTING=Stand-offs&STANDOFF MODEL=AL25-30A
    required: true
  - variable: STANDOFF SIZE - AL16
    label: STANDOFF SIZE
    column: 3
    type: text
    default: 16 mm dia. x 25 mm
    show_if: MOUNTING=Stand-offs&STANDOFF MODEL=AL16-25A
    required: true
  - variable: STANDOFF SIZE - CUSTOM
    label: STANDOFF SIZE
    column: 3
    type: text
    show_if: MOUNTING=Stand-offs&STANDOFF MODEL=CUSTOM
    required: true
    notes: e.g. 3/4" dia. x 1"
  - variable: STANDOFF FINISH
    column: 3
    type: select
    default: Brushed Aluminum
    options:
      - Brushed Aluminum
      - Satin Aluminum
      - Black
      - Chrome
      - Gold
    show_if: MOUNTING=Stand-offs
    required: true
