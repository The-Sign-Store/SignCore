# yaml-language-server: $schema=../../../schemas/component.schema.json
schema: signcore.component/v1
id: HALO_LETTERS
name: Halo Letters
version: 1.0.0
order: 110
description: Reverse / halo lit channel letters (one line of copy per block).
show_as_tool: false
repeatable: true
fields:
  - variable: QUANTITY
    label: QTY
    column: 1
    type: autoqty
    default: "6"
    options:
      - LETTER HEIGHT
    required: true
    notes: Counts letters in TEXT
  - variable: LETTER HEIGHT
    column: 1
    type: number
    default: "18"
    required: true
    notes: Inches, tallest letter
  - variable: TEXT
    column: 1
    type: text
    default: SAMPLE
    required: true
  - variable: LETTER TYPE
    label: TYPE
    column: 1
    type: select
    default: Reverse Lit (Halo)
    options:
      - Reverse Lit (Halo)
      - Reverse Non-Lit
    required: true
  - variable: FACE
    column: 2
    type: select
    default: .080 Aluminum
    options:
      - .080 Aluminum
      - .063 Aluminum
      - .125 Aluminum
      - Brushed Aluminum
      - Stainless Steel
    required: true
    signos: "Master_Mat_Metals: ALM_SHT_080 / ALM_SHT_063"
    notes: .063 OK under 12"
  - variable: FACE PAINT
    label: FACE COLOR
    column: 2
    type: paint
    show_if: FACE!=Brushed Aluminum&FACE!=Stainless Steel
    required: true
  - variable: FACE GRAPHICS
    column: 2
    type: select
    default: None
    options:
      - None
      - Cut Vinyl Accent
      - Digital Print
  - variable: RETURN DEPTH
    label: RETURN
    column: 3
    type: select
    default: 3"
    options:
      - 2"
      - 3"
      - 5"
    required: true
    signos: "Master_Mat_Fab_Channel: CLD-COM-COIL-3 / -5"
  - variable: RETURN GAUGE
    label: GAUGE
    column: 3
    type: select
    default: ".063"
    options:
      - ".063"
      - ".080"
      - ".040"
    required: true
    notes: .063 standard for halo
  - variable: RETURN FINISH
    label: RETURN COLOR
    column: 3
    type: finish
    default: Match Face
    options:
      - Match Face
      - Black
      - Bronze
      - White
    required: true
  - variable: BACKS
    column: 4
    type: select
    default: 3/16" Clear Polycarbonate
    options:
      - 3/16" Clear Polycarbonate
      - 1/4" Clear Acrylic
      - Aluminum (Non-Lit)
    required: true
  - variable: DIFFUSER VINYL
    label: DIFFUSER
    column: 4
    type: select
    default: No
    options:
      - No
      - Yes
    show_if: LETTER TYPE=Reverse Lit (Halo)
    notes: Smoother halo
  - variable: STANDOFFS
    column: 4
    type: select
    default: 1.5" Aluminum
    options:
      - 1" Aluminum
      - 1.5" Aluminum
      - 2" Aluminum
    required: true
    notes: Pattern needed
  - variable: WALL SURFACE
    label: WALL
    column: 4
    type: text
    required: true
    notes: e.g. Painted stucco, light beige
